  <style>
:root {
  --bg: #0a0b10;
  --bg-card: #13151d;
  --ink: #f0f0f4;
  --ink-soft: #9a9aa6;
  --blue: #0066ff;
  --blue-glow: rgba(0,102,255,0.3);
  --line: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--ink); min-height: calc(100 * min(var(--vh,1vh),1vh)); overflow-x: hidden; }
.type-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.type-chips::-webkit-scrollbar { display: none; }
.type-chip {
  flex: 0 0 auto; padding: 7px 12px; border-radius: 20px; font-size: 12px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--ink-soft);
  cursor: pointer; white-space: nowrap; transition: all .2s;
}
.type-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.field-input, textarea.field-input, select.field-input {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; color: #fff; font-family: 'Vazirmatn'; font-size: 13px; outline: none;
  transition: border-color .2s;
}
.field-input:focus { border-color: var(--blue); }
.field-input::placeholder { color: rgba(255,255,255,0.3); }
select.field-input option { background: #13151d; color: #fff; }
textarea.field-input { min-height: 60px; resize: none; }
.qr-frame {
  width: 100%; aspect-ratio: 1; max-width: 280px; margin: 0 auto;
  background: #fff; border-radius: 16px; display: flex; align-items: center;
  justify-content: center; padding: 16px; box-shadow: 0 8px 40px -12px var(--blue-glow);
}
.qr-frame canvas, .qr-frame svg { max-width: 100%; max-height: 100%; }
.btn-primary {
  width: 100%; padding: 13px; border-radius: 12px; border: none; font-family: 'Vazirmatn';
  font-size: 14px; font-weight: 700; background: var(--blue); color: #fff; cursor: pointer;
  transition: filter .2s;
}
.btn-primary:active { filter: brightness(0.9); }
.btn-ghost {
  flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: #fff; font-family: 'Vazirmatn'; font-size: 13px;
  font-weight: 600; cursor: pointer; transition: background .2s;
}
.btn-ghost:active { background: rgba(255,255,255,0.06); }
.btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
.control-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.color-swatch {
  width: 30px; height: 30px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.15);
  overflow: hidden; padding: 0; cursor: pointer;
}
.color-swatch input[type="color"] { width: 150%; height: 150%; margin: -25%; border: none; cursor: pointer; }
input[type="range"] {
  -webkit-appearance: none; width: 100px; height: 4px; border-radius: 4px;
  background: rgba(255,255,255,0.12); outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--blue); cursor: pointer;
}
</style>

 <body data-template-id="__page-root" class="w-full">
  <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-[rgba(10,11,16,0.8)] border-b border-[rgba(255,255,255,0.06)]">
   <div class="flex items-center justify-between px-4 py-3">
    <h1 data-template-id="brand" class="canva-text text-base font-extrabold"></h1><button id="themeToggle" class="text-lg w-8 h-8 flex items-center justify-center">🌙</button>
   </div>
  </header>
  <main class="pt-14 pb-6 px-4 max-w-md mx-auto w-full flex flex-col gap-4">
   <!-- Type Chips -->
   <div class="type-chips" id="typeChips"></div><!-- Dynamic Fields -->
   <div id="dynFields" class="flex flex-col gap-3"></div><!-- Controls -->
   <div class="flex flex-col gap-3 border-t border-[rgba(255,255,255,0.06)] pt-3">
    <div class="control-row">
     <label class="text-xs text-[var(--ink-soft)]">رنگ</label>
     <div class="flex gap-2">
      <button class="color-swatch" style="background:#0a0a0c"><input type="color" id="colorDark" value="#0a0a0c"></button> <button class="color-swatch" style="background:#ffffff"><input type="color" id="colorLight" value="#ffffff"></button>
     </div>
    </div>
    <div class="control-row">
     <label class="text-xs text-[var(--ink-soft)]">اندازه: <span id="sizeLabel">260</span></label> <input type="range" id="sizeRange" min="160" max="460" value="260">
    </div>
    <div class="control-row" id="eccRow">
     <label class="text-xs text-[var(--ink-soft)]">تصحیح خطا</label> <select class="field-input" id="eccSelect" style="width:auto;padding:6px 10px;font-size:12px;"> <option value="L">L</option><option value="M" selected>M</option><option value="Q">Q</option><option value="H">H</option> </select>
    </div>
    <div class="control-row" id="logoRow">
     <label class="text-xs text-[var(--ink-soft)]">لوگو</label>
     <div class="flex items-center gap-2">
      <span id="logoClear" class="text-xs text-red-400 cursor-pointer hidden">حذف</span> <img id="logoThumb" class="w-7 h-7 rounded object-cover border border-[var(--line)] hidden" alt=""> <label for="logoInput" class="text-xs bg-[rgba(255,255,255,0.08)] border border-[var(--line)] rounded-lg px-3 py-1.5 cursor-pointer">آپلود</label> <input type="file" id="logoInput" accept="image/*" hidden>
     </div>
    </div>
   </div><!-- Preview -->
   <div class="qr-frame" id="qrFrame">
    <span class="text-gray-400 text-xs text-center">اطلاعات رو وارد کن</span>
   </div><!-- Actions --> <button class="btn-primary" id="generateBtn">🔲 ساخت کد</button>
   <div class="flex gap-2">
    <button class="btn-ghost" id="downloadBtn">⬇ دانلود</button> <button class="btn-ghost" id="sendBtn">✈ ارسال در تلگرام</button>
   </div>
   <p id="sendStatus" class="text-xs text-center text-[var(--ink-soft)] min-h-[16px]"></p>
  </main>
  <script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){tg.ready();tg.expand();}

function escWifi(s){return(s||'').replace(/([\\;,:"])/g,'\\$1');}

const QR_TYPES={
link:{label:'لینک',icon:'🌐',fields:[{id:'url',type:'url',label:'آدرس',placeholder:'https://example.com'}],build:v=>(v.url||'').trim()},
text:{label:'متن',icon:'📝',fields:[{id:'text',type:'textarea',label:'متن',placeholder:'متن دلخواه...'}],build:v=>(v.text||'').trim()},
phone:{label:'تلفن',icon:'📞',fields:[{id:'phone',type:'tel',label:'شماره',placeholder:'+98912...'}],build:v=>`tel:${(v.phone||'').trim()}`},
email:{label:'ایمیل',icon:'📧',fields:[{id:'to',type:'email',label:'ایمیل'},{id:'subject',type:'text',label:'موضوع'}],build:v=>{let s=`mailto:${(v.to||'').trim()}`;if(v.subject)s+='?subject='+encodeURIComponent(v.subject);return s;}},
wifi:{label:'وای‌فای',icon:'📶',fields:[{id:'ssid',type:'text',label:'SSID'},{id:'password',type:'text',label:'رمز'},{id:'enc',type:'select',label:'رمزنگاری',options:[['WPA','WPA'],['WEP','WEP'],['nopass','بدون رمز']]}],build:v=>`WIFI:T:${v.enc||'WPA'};S:${escWifi(v.ssid)};P:${escWifi(v.password)};;`},
location:{label:'موقعیت',icon:'📍',fields:[{id:'lat',type:'text',label:'Lat',placeholder:'35.6892'},{id:'lng',type:'text',label:'Lng',placeholder:'51.3890'}],build:v=>`geo:${(v.lat||'0').trim()},${(v.lng||'0').trim()}`},
vcard:{label:'ویزیت',icon:'👤',fields:[{id:'name',type:'text',label:'نام'},{id:'phone',type:'tel',label:'تلفن'},{id:'email',type:'email',label:'ایمیل'}],build:v=>['BEGIN:VCARD','VERSION:3.0',`FN:${v.name||''}`,`TEL:${v.phone||''}`,v.email?`EMAIL:${v.email}`:null,'END:VCARD'].filter(Boolean).join('\n')},
sms:{label:'پیامک',icon:'💬',fields:[{id:'phone',type:'tel',label:'شماره'},{id:'message',type:'textarea',label:'پیام'}],build:v=>`sms:${(v.phone||'').trim()}${v.message?'?body='+encodeURIComponent(v.message):''}`},
whatsapp:{label:'واتساپ',icon:'💚',fields:[{id:'phone',type:'tel',label:'شماره',placeholder:'98912...'},{id:'message',type:'textarea',label:'پیام'}],build:v=>{const n=(v.phone||'').replace(/[^0-9]/g,'');return`https://wa.me/${n}${v.message?'?text='+encodeURIComponent(v.message):''}`;}},
telegram:{label:'تلگرام',icon:'✈️',fields:[{id:'username',type:'text',label:'یوزرنیم',placeholder:'username'}],build:v=>{let u=(v.username||'').trim().replace(/^@/,'');if(!u)return'';if(u.startsWith('http'))return u;return`https://t.me/${u}`;}},
barcode:{label:'بارکد',icon:'▦',isBarcode:true,fields:[{id:'code',type:'text',label:'کد',placeholder:'ABC12345'}],build:v=>(v.code||'').trim()},
};

const typeChipsEl=document.getElementById('typeChips');
const dynFieldsEl=document.getElementById('dynFields');
const qrFrame=document.getElementById('qrFrame');
const colorDark=document.getElementById('colorDark');
const colorLight=document.getElementById('colorLight');
const sizeRange=document.getElementById('sizeRange');
const sizeLabel=document.getElementById('sizeLabel');
const eccSelect=document.getElementById('eccSelect');
const eccRow=document.getElementById('eccRow');
const logoRow=document.getElementById('logoRow');
const logoInput=document.getElementById('logoInput');
const logoThumb=document.getElementById('logoThumb');
const logoClear=document.getElementById('logoClear');
const generateBtn=document.getElementById('generateBtn');
const downloadBtn=document.getElementById('downloadBtn');
const sendBtn=document.getElementById('sendBtn');
const sendStatus=document.getElementById('sendStatus');

let currentType='link', debounceTimer, lastCanvas=null, logoImage=null;

Object.keys(QR_TYPES).forEach(key=>{
  const t=QR_TYPES[key];
  const chip=document.createElement('div');
  chip.className='type-chip'+(key===currentType?' active':'');
  chip.dataset.type=key;
  chip.textContent=t.icon+' '+t.label;
  chip.addEventListener('click',()=>selectType(key));
  typeChipsEl.appendChild(chip);
});

function selectType(key){
  currentType=key;
  document.querySelectorAll('.type-chip').forEach(c=>c.classList.toggle('active',c.dataset.type===key));
  renderFields();
  const isB=QR_TYPES[key].isBarcode;
  eccRow.style.display=isB?'none':'flex';
  logoRow.style.display=isB?'none':'flex';
  render();
}

function renderFields(){
  const t=QR_TYPES[currentType];
  dynFieldsEl.innerHTML='';
  t.fields.forEach(f=>{
    const wrap=document.createElement('div');
    let input;
    if(f.type==='textarea'){input=document.createElement('textarea');}
    else if(f.type==='select'){
      input=document.createElement('select');
      f.options.forEach(([val,text])=>{const o=document.createElement('option');o.value=val;o.textContent=text;input.appendChild(o);});
    } else {input=document.createElement('input');input.type=f.type;}
    input.className='field-input';
    input.dataset.key=f.id;
    if(f.placeholder)input.placeholder=f.placeholder;
    const lbl=document.createElement('label');
    lbl.className='text-xs text-[var(--ink-soft)] mb-1 block';
    lbl.textContent=f.label;
    wrap.appendChild(lbl);
    wrap.appendChild(input);
    dynFieldsEl.appendChild(wrap);
  });
  dynFieldsEl.querySelectorAll('.field-input').forEach(el=>{
    el.addEventListener('input',()=>{clearTimeout(debounceTimer);debounceTimer=setTimeout(render,200);});
  });
}

function collectValues(){
  const v={};
  dynFieldsEl.querySelectorAll('.field-input').forEach(el=>{v[el.dataset.key]=el.value;});
  return v;
}

[colorDark,colorLight].forEach(el=>{
  el.addEventListener('input',()=>{el.closest('.color-swatch').style.background=el.value;render();});
});
sizeRange.addEventListener('input',()=>{sizeLabel.textContent=sizeRange.value;render();});
eccSelect.addEventListener('change',render);

logoInput.addEventListener('change',()=>{
  const file=logoInput.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{logoImage=img;logoThumb.src=reader.result;logoThumb.classList.remove('hidden');logoClear.classList.remove('hidden');eccSelect.value='H';render();};
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});
logoClear.addEventListener('click',()=>{logoImage=null;logoInput.value='';logoThumb.classList.add('hidden');logoClear.classList.add('hidden');render();});

function render(){
  const t=QR_TYPES[currentType];
  if(t.isBarcode&&typeof JsBarcode==='undefined'){qrFrame.innerHTML='<span class="text-red-400 text-xs">بارکد لود نشد</span>';lastCanvas=null;return;}
  if(!t.isBarcode&&typeof QRCode==='undefined'){qrFrame.innerHTML='<span class="text-red-400 text-xs">QR لود نشد</span>';lastCanvas=null;return;}

  const values=collectValues();
  const content=t.build(values);
  if(!content){qrFrame.innerHTML='<span class="text-gray-400 text-xs text-center">اطلاعات رو وارد کن</span>';lastCanvas=null;return;}

  const size=parseInt(sizeRange.value,10);
  const dark=colorDark.value;
  const light=colorLight.value;

  if(t.isBarcode){
    const canvas=document.createElement('canvas');
    try{
      JsBarcode(canvas,content,{format:'CODE128',lineColor:dark,background:light,width:2,height:Math.max(60,size/3),displayValue:true,fontSize:14,margin:10});
      qrFrame.innerHTML='';qrFrame.appendChild(canvas);lastCanvas=canvas;
    }catch(e){qrFrame.innerHTML='<span class="text-gray-400 text-xs">کد نامعتبر</span>';lastCanvas=null;}
    return;
  }

  const canvas=document.createElement('canvas');
  QRCode.toCanvas(canvas,content,{width:size,margin:1,errorCorrectionLevel:eccSelect.value,color:{dark,light}},function(err){
    if(err){qrFrame.innerHTML='<span class="text-red-400 text-xs">خطا در ساخت</span>';lastCanvas=null;return;}
    if(logoImage){
      const ctx=canvas.getContext('2d');
      const ls=canvas.width*0.22;
      const x=(canvas.width-ls)/2,y=(canvas.height-ls)/2,pad=ls*0.12;
      ctx.fillStyle='#fff';
      const r=8;
      ctx.beginPath();
      ctx.moveTo(x-pad+r,y-pad);
      ctx.lineTo(x-pad+ls+pad*2-r,y-pad);
      ctx.quadraticCurveTo(x-pad+ls+pad*2,y-pad,x-pad+ls+pad*2,y-pad+r);
      ctx.lineTo(x-pad+ls+pad*2,y-pad+ls+pad*2-r);
      ctx.quadraticCurveTo(x-pad+ls+pad*2,y-pad+ls+pad*2,x-pad+ls+pad*2-r,y-pad+ls+pad*2);
      ctx.lineTo(x-pad+r,y-pad+ls+pad*2);
      ctx.quadraticCurveTo(x-pad,y-pad+ls+pad*2,x-pad,y-pad+ls+pad*2-r);
      ctx.lineTo(x-pad,y-pad+r);
      ctx.quadraticCurveTo(x-pad,y-pad,x-pad+r,y-pad);
      ctx.closePath();
      ctx.fill();
      ctx.drawImage(logoImage,x,y,ls,ls);
    }
    qrFrame.innerHTML='';qrFrame.appendChild(canvas);lastCanvas=canvas;
  });
}

generateBtn.addEventListener('click',()=>{render();if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');});

downloadBtn.addEventListener('click',()=>{
  if(!lastCanvas){render();return;}
  const a=document.createElement('a');
  a.download='codino-'+currentType+'.png';
  a.href=lastCanvas.toDataURL('image/png');
  a.click();
});

sendBtn.addEventListener('click',async()=>{
  if(!lastCanvas){render();return;}
  if(!tg){sendStatus.textContent='فقط داخل تلگرام کار می‌کند';setTimeout(()=>sendStatus.textContent='',3000);return;}

  sendBtn.disabled=true;
  sendStatus.textContent='در حال ارسال...';

  try{
    const dataUrl=lastCanvas.toDataURL('image/png');
    const base64=dataUrl.split(',')[1];

    // Use Telegram WebApp sendData to pass image back to bot
    if(tg.sendData){
      tg.sendData(JSON.stringify({type:currentType,image:base64}));
      sendStatus.textContent='✓ ارسال شد';
      if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
    } else {
      sendStatus.textContent='این نسخه تلگرام پشتیبانی نمی‌کند';
    }
  }catch(e){
    sendStatus.textContent='خطا در ارسال';
  }finally{
    sendBtn.disabled=false;
    setTimeout(()=>sendStatus.textContent='',3000);
  }
});

renderFields();
render();
</script>
