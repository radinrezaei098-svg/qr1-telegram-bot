<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کُدینو | Codino</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --blue: #0A84FF;
    --blue-deep: #0060DF;
    --blue-light: #EAF4FF;
    --blue-pale: #F5FAFF;
    --black: #0B0D12;
    --gray: #6E7480;
    --white: #FFFFFF;
    --radius: 22px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    font-family:"Vazirmatn", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: linear-gradient(180deg, var(--blue-pale) 0%, var(--white) 40%);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 14px;
  }

  .phone-frame{
    width:100%;
    max-width: 380px;
    background: var(--white);
    border-radius: 34px;
    box-shadow:
      0 1px 2px rgba(10,20,40,0.04),
      0 20px 50px -12px rgba(10,60,140,0.18),
      0 0 0 1px rgba(10,60,140,0.05);
    padding: 30px 22px 22px;
    position:relative;
    overflow:hidden;
  }

  .phone-frame::before{
    content:"";
    position:absolute;
    top:-120px; right:-90px;
    width:260px; height:260px;
    background: radial-gradient(circle, var(--blue-light) 0%, transparent 70%);
    pointer-events:none;
  }

  header{
    text-align:center;
    margin-bottom: 26px;
    position:relative;
  }

  .logo-badge{
    width:56px; height:56px;
    margin:0 auto 14px;
    border-radius:16px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px -6px rgba(10,132,255,0.55);
  }

  .logo-badge svg{ width:28px; height:28px; }

  .brand-title{
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: var(--black);
  }

  .brand-title span{ color: var(--blue); }

  .brand-sub{
    font-size: 12.5px;
    color: var(--gray);
    margin-top: 4px;
    font-weight:500;
  }

  .field-group{
    margin-bottom: 14px;
  }

  .field-label{
    font-size: 12.5px;
    font-weight:600;
    color: var(--gray);
    margin-bottom: 8px;
    display:block;
    padding-right:4px;
  }

  input[type="text"]{
    width:100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid #E4ECF7;
    background: var(--blue-pale);
    font-family: inherit;
    font-size: 14.5px;
    color: var(--black);
    outline:none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    text-align:right;
  }

  input[type="text"]::placeholder{ color:#9AA5B4; }

  input[type="text"]:focus{
    border-color: var(--blue);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(10,132,255,0.12);
  }

  .btn{
    width:100%;
    padding: 15px 16px;
    border:none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight:700;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .18s ease, opacity .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .btn:active{ transform: scale(0.97); }

  .btn-primary{
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
    color:var(--white);
    box-shadow: 0 10px 24px -8px rgba(10,132,255,0.55);
    margin-top:4px;
  }

  .btn-primary:hover{ box-shadow: 0 14px 28px -8px rgba(10,132,255,0.65); }

  .qr-section{
    margin-top: 22px;
    display:none;
    animation: fadeUp .35s ease;
  }

  .qr-section.visible{ display:block; }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  #qr-card{
    background: var(--white);
    border: 1.5px solid var(--blue-light);
    border-radius: 20px;
    padding: 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  #qrcode{
    background:var(--white);
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 6px 18px -6px rgba(10,60,140,0.15);
    display:flex;
  }

  #qrcode img, #qrcode canvas{
    border-radius: 6px;
    display:block;
  }

  .qr-caption{
    font-size: 12.5px;
    color: var(--gray);
    text-align:center;
    word-break: break-all;
    max-width: 260px;
    font-weight:500;
  }

  .btn-telegram{
    margin-top: 16px;
    background: var(--black);
    color: var(--white);
  }

  .btn-telegram svg{ width:18px; height:18px; fill:var(--white); }

  .btn-telegram:disabled{ opacity:.55; cursor:not-allowed; }

  .hint{
    text-align:center;
    font-size:11.5px;
    color:#9AA5B4;
    margin-top:10px;
  }

  footer{
    margin-top: 26px;
    text-align:center;
    font-size: 11.5px;
    color: var(--gray);
    font-weight:600;
    letter-spacing: 0.1px;
  }

  footer span{ color: var(--blue); }

  .divider{
    height:1px;
    background: linear-gradient(90deg, transparent, #E4ECF7, transparent);
    margin: 18px 0 14px;
  }

  .toast{
    position:fixed;
    bottom: 26px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--black);
    color:var(--white);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight:600;
    opacity:0;
    transition: all .25s ease;
    pointer-events:none;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.35);
    z-index:999;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <div class="phone-frame">
    <header>
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.8"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.8"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.8"/>
          <path d="M14 14H17V17H14V14Z" fill="white"/>
          <path d="M18 14H21V17H18V14Z" fill="white"/>
          <path d="M14 18H17V21H14V18Z" fill="white"/>
          <path d="M18 18H21V21H18V18Z" fill="white"/>
        </svg>
      </div>
      <div class="brand-title">کُدینو <span>| Codino</span></div>
      <div class="brand-sub">ساخت آسان و سریع کیوارکد</div>
    </header>

    <div class="field-group">
      <label class="field-label">متن یا لینک مورد نظر را وارد کنید</label>
      <input type="text" id="qr-input" placeholder="مثلاً: https://example.com" />
    </div>

    <button class="btn btn-primary" id="generate-btn">
      ساخت کیوارکد
    </button>

    <div class="qr-section" id="qr-section">
      <div class="divider"></div>
      <div id="qr-card">
        <div id="qrcode"></div>
        <div class="qr-caption" id="qr-caption"></div>
      </div>

      <button class="btn btn-telegram" id="telegram-btn">
        <svg viewBox="0 0 24 24"><path d="M21.05 3.16 2.53 10.4c-1.24.5-1.23 1.2-.22 1.51l4.77 1.49 1.83 5.6c.22.62.36.86.73.86.34 0 .5-.16.7-.35l1.86-1.8 4.02 2.97c.74.41 1.27.2 1.46-.68l2.65-12.5c.28-1.16-.42-1.68-1.28-1.34Zm-11.7 9.03 8.35-5.27c.4-.24.76-.11.46.15L9.9 14.4l-.28 3.03-1.42-4.24Z"/></svg>
        ارسال در تلگرام
      </button>

      <div class="hint">در صورت پشتیبانی مرورگر، تصویر کیوارکد مستقیم ارسال می‌شود</div>
    </div>

    <footer>توسط گروه کُدینو <span>| Codino</span> ساخته شده</footer>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const input = document.getElementById('qr-input');
  const genBtn = document.getElementById('generate-btn');
  const qrSection = document.getElementById('qr-section');
  const qrCard = document.getElementById('qr-card');
  const qrContainer = document.getElementById('qrcode');
  const qrCaption = document.getElementById('qr-caption');
  const telegramBtn = document.getElementById('telegram-btn');
  const toast = document.getElementById('toast');

  let currentQR = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2400);
  }

  function generateQR(){
    const value = input.value.trim();
    if(!value){
      input.focus();
      input.style.borderColor = '#FF3B30';
      setTimeout(()=> input.style.borderColor = '', 900);
      showToast('لطفاً یک متن یا لینک وارد کنید');
      return;
    }

    qrContainer.innerHTML = '';

    currentQR = new QRCode(qrContainer, {
      text: value,
      width: 210,
      height: 210,
      colorDark: "#0B0D12",
      colorLight: "#FFFFFF",
      correctLevel: QRCode.CorrectLevel.H
    });

    qrCaption.textContent = value;
    qrSection.classList.add('visible');
    qrSection.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  genBtn.addEventListener('click', generateQR);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') generateQR(); });

  telegramBtn.addEventListener('click', async ()=>{
    if(!qrSection.classList.contains('visible')){
      showToast('ابتدا یک کیوارکد بسازید');
      return;
    }

    telegramBtn.disabled = true;

    try{
      const canvas = await html2canvas(qrCard, {
        backgroundColor: '#FFFFFF',
        scale: 2
      });

      canvas.toBlob(async (blob)=>{
        const file = new File([blob], 'codino-qr.png', { type: 'image/png' });

        if(navigator.canShare && navigator.canShare({ files:[file] })){
          try{
            await navigator.share({
              files: [file],
              title: 'کُدینو | Codino',
              text: 'کیوارکد ساخته شده با کُدینو'
            });
          }catch(err){
            if(err.name !== 'AbortError'){
              fallbackTelegramShare();
            }
          }
        } else {
          fallbackTelegramShare();
        }

        telegramBtn.disabled = false;
      }, 'image/png');

    }catch(err){
      telegramBtn.disabled = false;
      fallbackTelegramShare();
    }
  });

  function fallbackTelegramShare(){
    const value = input.value.trim();
    const text = encodeURIComponent('کیوارکد ساخته شده با کُدینو | Codino:\n' + value);
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(value) + '&text=' + text;
    window.open(url, '_blank');
    showToast('صفحه اشتراک‌گذاری تلگرام باز شد');
  }
</script>

</body>
</html>
