<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Codino</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode/dist/JsBarcode.all.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}

body{
background:#111827;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{

background:#1f2937;

padding:20px;

border-radius:18px;

margin-bottom:20px;

}

label{
display:block;
margin-bottom:8px;
font-size:14px;
}

select,
input,
textarea{

width:100%;

padding:12px;

border:none;

border-radius:12px;

margin-bottom:15px;

background:#374151;

color:white;

font-size:15px;

}

textarea{

height:90px;

resize:none;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:16px;

cursor:pointer;

margin-top:10px;

}

button:hover{

background:#1d4ed8;

}

#preview{

margin-top:25px;

display:flex;

justify-content:center;

align-items:center;

background:white;

border-radius:18px;

padding:20px;

min-height:320px;

}

#preview canvas{

max-width:100%;

}

.actions{

display:flex;

gap:10px;

}

.actions button{

flex:1;

}

.hidden{

display:none;

}

.footer{

margin-top:30px;

text-align:center;

color:#9ca3af;

font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<h1>Codino</h1>

<div class="card">

<label>

نوع کد

</label>

<select id="type">

<option value="link">🌐 لینک</option>

<option value="text">📝 متن</option>

<option value="phone">📞 تلفن</option>

<option value="email">📧 ایمیل</option>

<option value="wifi">📶 وای فای</option>

<option value="telegram">✈️ تلگرام</option>

<option value="whatsapp">💚 واتساپ</option>

<option value="barcode">▦ بارکد</option>

</select>

<div id="fields"></div>

<label>

رنگ کد

</label>

<input type="color" id="dark" value="#000000">

<label>

رنگ زمینه

</label>

<input type="color" id="light" value="#ffffff">

<label>

اندازه

</label>

<input
type="range"
id="size"
min="180"
max="500"
value="280">

<button id="generate">

ساخت کد

</button>

</div>

<div class="card">

<div id="preview">

کدی ساخته نشده است

</div>

<div class="actions">

<button id="download">

دانلود PNG

</button>

<button id="telegramSend">

ارسال به تلگرام

</button>

</div>

</div>

<div class="footer">

Created by Pedram AZ

</div>

</div>

<script>

const tg=window.Telegram?.WebApp;

if(tg){

tg.ready();

tg.expand();

}

const fields=document.getElementById("fields");

const preview=document.getElementById("preview");

let canvas=null;
