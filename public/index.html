<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>در حال بروزرسانی</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
        color: white;
        overflow: hidden;
    }

    .container {
        text-align: center;
        padding: 40px;
        width: 90%;
        max-width: 500px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(15px);
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,.3);
        animation: fade 1s ease;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 15px;
    }

    p {
        color: #cbd5e1;
        font-size: 17px;
        line-height: 2;
    }

    .loader {
        width: 90px;
        height: 90px;
        margin: 30px auto;
        border-radius: 50%;
        border: 8px solid rgba(255,255,255,.2);
        border-top-color: #38bdf8;
        animation: spin 1s linear infinite;
    }

    .dots span {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin: 5px;
        background: #38bdf8;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
    }

    .dots span:nth-child(2){
        animation-delay: .2s;
    }

    .dots span:nth-child(3){
        animation-delay: .4s;
    }

    .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #94a3b8;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes bounce {
        50% {
            transform: translateY(-12px);
        }
    }

    @keyframes fade {
        from {
            opacity:0;
            transform: translateY(30px);
        }
        to {
            opacity:1;
            transform: translateY(0);
        }
    }

    .bg-circle {
        position:absolute;
        border-radius:50%;
        filter:blur(80px);
        opacity:.5;
    }

    .one {
        width:300px;
        height:300px;
        background:#0ea5e9;
        top:-100px;
        left:-100px;
    }

    .two {
        width:250px;
        height:250px;
        background:#8b5cf6;
        bottom:-80px;
        right:-80px;
    }

</style>
</head>

<body>

<div class="bg-circle one"></div>
<div class="bg-circle two"></div>

<div class="container">

    <div class="loader"></div>

    <h1>در حال ساخت و بروزرسانی صفحه</h1>

    <p>
        ما در حال آماده‌سازی یک تجربه‌ی جدید برای شما هستیم.
        لطفاً چند لحظه صبر کنید...
    </p>

    <div class="dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="footer">
        © 2026 - تمامی حقوق محفوظ است
    </div>

</div>

</body>
</html>
