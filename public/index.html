<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کُدینو | Codino</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg-top:#F5FAFF; --bg-bottom:#FFFFFF;
    --surface:#FFFFFF; --surface-border:#EAF4FF;
    --text:#0B0D12; --muted:#6E7480;
    --accent:#0A84FF; --accent-deep:#0060DF; --accent-soft:#EAF4FF;
    --input-bg:#F5FAFF; --input-border:#E4ECF7;
    --tg-bg:#0B0D12; --tg-text:#FFFFFF;
    --dl-bg:#FFFFFF; --dl-text:#0A84FF; --dl-border:#0A84FF;
    --shadow-tint: rgba(10,60,140,0.18);
    --glow-tint: rgba(10,132,255,0.55);
  }

  html[data-theme="dark"]{
    --bg-top:#0B0D12; --bg-bottom:#12151C;
    --surface:#12151C; --surface-border:#1E2430;
    --text:#F5F7FA; --muted:#8A93A3;
    --accent:#3AA0FF; --accent-deep:#0A84FF; --accent-soft:#16202E;
    --input-bg:#171B22; --input-border:#232A36;
    --tg-bg:#3AA0FF; --tg-text:#0B0D12;
    --dl-bg:#171B22; --dl-text:#3AA0FF; --dl-border:#2B3444;
    --shadow-tint: rgba(0,0,0,0.55);
    --glow-tint: rgba(58,160,255,0.45);
  }

  html[data-theme="ocean"]{
    --bg-top:#EAFBFF; --bg-bottom:#FFFFFF;
    --surface:#FFFFFF; --surface-border:#D8F3F8;
    --text:#062A33; --muted:#4C7A83;
    --accent:#00B8D9; --accent-deep:#0086A8; --accent-soft:#E0FAFF;
    --input-bg:#F1FDFF; --input-border:#D3F1F7;
    --tg-bg:#062A33; --tg-text:#FFFFFF;
    --dl-bg:#FFFFFF; --dl-text:#00A6C4; --dl-border:#00B8D9;
    --shadow-tint: rgba(0,140,168,0.18);
    --glow-tint: rgba(0,184,217,0.5);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    font-family:"Vazirmatn", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 14px;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 45%);
    color: var(--text);
    transition: background .35s ease, color .35s ease;
  }

  .phone-frame{
    width:100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 34px;
    box-shadow:
      0 1px 2px rgba(10,20,40,0.04),
      0 20px 50px -12px var(--shadow-tint),
      0 0 0 1px var(--surface-border);
    padding: 26px 22px 22px;
    position:relative;
    overflow:hidden;
    transition: background .35s ease, box-shadow .35s ease;
  }

  .phone-frame::before{
    content:"";
    position:absolute;
    top:-120px; right:-90px;
    width:260px; height:260px;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    pointer-events:none;
    transition: background .35s ease;
  }

  .theme-switcher{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom: 18px;
    position:relative;
  }

  .theme-dot{
    width:28px; height:28px;
    border-radius:50%;
    border: 2px solid transparent;
    cursor:pointer;
    padding:0;
    position:relative;
    transition: transform .15s ease, border-color .15s ease;
  }

  .theme-dot:active{ transform: scale(0.9); }
  .theme-dot.active{ border-color: var(--text); }

  .theme-dot[data-t="classic"]{ background: linear-gradient(135deg,#0A84FF,#0060DF); }
  .theme-dot[data-t="dark"]{ background: linear-gradient(135deg,#12151C,#3AA0FF); }
  .theme-dot[data-t="ocean"]{ background: linear-gradient(135deg,#00B8D9,#062A33); }

  header{
    text-align:center;
    margin-bottom: 24px;
    position:relative;
  }

  .logo-badge{
    width:56px; height:56px;
    margin:0 auto 14px;
    border-radius:16px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px -6px var(--glow-tint);
    transition: background .35s ease, box-shadow .35s ease;
  }

  .logo-badge svg{ width:28px; height:28px; }

  .brand-title{
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: var(--text);
  }

  .brand-title span{ color: var(--accent); }

  .brand-sub{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    font-weight:500;
  }

  .field-group{ margin-bottom: 14px; }

  .field-label{
    font-size: 12.5px;
    font-weight:600;
    color: var(--muted);
    margin-bottom: 8px;
    display:block;
    padding-right:4px;
  }

  input[type="text"]{
    width:100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    font-family: inherit;
    font-size: 14.5px;
    color: var(--text);
    outline:none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    text-align:right;
  }

  input[type="text"]::placeholder{ color: var(--muted); opacity:.8; }

  input[type="text"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .btn{
    width:100%;
    padding: 15px 16px;
    border:none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight:700;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .18s ease, opacity .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .btn-primary{
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color:#FFFFFF;
    box-shadow: 0 10px 24px -8px var(--glow-tint);
    margin-top:4px;
  }

  .qr-section{
    margin-top: 22px;
    display:none;
    animation: fadeUp .35s ease;
  }

  .qr-section.visible{ display:block; }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  #qr-card{
    background: #FFFFFF;
    border: 1.5px solid var(--surface-border);
    border-radius: 20px;
    padding: 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  #qrcode{
    background:#FFFFFF;
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 6px 18px -6px var(--shadow-tint);
    display:flex;
  }

  #qrcode img, #qrcode canvas{ border-radius: 6px; display:block; }

  .qr-caption{
    font-size: 12.5px;
    color: #6E7480;
    text-align:center;
    word-break: break-all;
    max-width: 260px;
    font-weight:500;
  }

  .action-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }

  .btn-telegram{
    background: var(--tg-bg);
    color: var(--tg-text);
    flex:2;
  }

  .btn-telegram svg{ width:18px; height:18px; fill: var(--tg-text); }

  .btn-download{
    background: var(--dl-bg);
    color: var(--dl-text);
    border: 1.5px solid var(--dl-border);
    flex:1;
    padding: 15px 10px;
  }

  .hint{
    text-align:center;
    font-size:11.5px;
    color: var(--muted);
    margin-top:10px;
    line-height:1.7;
  }

  footer{
    margin-top: 24px;
    text-align:center;
    font-size: 11.5px;
    color: var(--muted);
    font-weight:600;
    letter-spacing: 0.1px;
  }

  footer span{ color: var(--accent); }

  .divider{
    height:1px;
    background: linear-gradient(90deg, transparent, var(--surface-border), transparent);
    margin: 18px 0 14px;
  }

  .toast{
    position:fixed;
    bottom: 26px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--surface);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight:600;
    opacity:0;
    transition: all .25s ease;
    pointer-events:none;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.35);
    z-index:999;
    max-width:88vw;
    text-align:center;
  }

  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .btn-screenshot{
    margin-top:10px;
    background: var(--accent-soft);
    color: var(--accent-deep);
    border: 1.5px solid var(--surface-border);
  }

  .lightbox{
    position:fixed;
    inset:0;
    background: rgba(6,10,18,0.82);
    backdrop-filter: blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    z-index:1200;
    padding: 26px 20px;
  }

  .lightbox.visible{ display:flex; }

  .lightbox img{
    max-width: 86vw;
    max-height: 62vh;
    border-radius: 18px;
    box-shadow: 0 20px 60px -10px rgba(0,0,0,0.6);
    -webkit-touch-callout: default;
  }

  .lightbox-hint{
    color:#EAF4FF;
    font-size: 13px;
    font-weight:600;
    text-align:center;
    max-width: 300px;
    line-height:1.8;
  }

  .lightbox-close{
    background: rgba(255,255,255,0.14);
    color:#FFFFFF;
    border:none;
    padding: 12px 26px;
    border-radius: 12px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

  <div class="phone-frame">
    <div class="theme-switcher">
      <button class="theme-dot active" data-t="classic" title="تم کلاسیک آبی"></button>
      <button class="theme-dot" data-t="dark" title="تم شب"></button>
      <button class="theme-dot" data-t="ocean" title="تم اقیانوسی"></button>
    </div>

    <header>
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.8"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.8"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.8"/>
          <path d="M14 14H17V17H14V14Z" fill="white"/>
          <path d="M18 14H21V17H18V14Z" fill="white"/>
          <path d="M14 18H17V21H14V18Z" fill="white"/>
          <path d="M18 18H21V21H18V18Z" fill="white"/>
        </svg>
      </div>
      <div class="brand-title">کُدینو <span>| Codino</span></div>
      <div class="brand-sub">ساخت آسان و سریع کیوارکد</div>
    </header>

    <div class="field-group">
      <label class="field-label">متن یا لینک مورد نظر را وارد کنید</label>
      <input type="text" id="qr-input" placeholder="مثلاً: https://example.com" />
    </div>

    <button class="btn btn-primary" id="generate-btn">ساخت کیوارکد</button>

    <div class="qr-section" id="qr-section">
      <div class="divider"></div>
      <div id="qr-card">
        <div id="qrcode"></div>
        <div class="qr-caption" id="qr-caption"></div>
      </div>

      <div class="action-row">
        <button class="btn btn-telegram" id="telegram-btn">
          <svg viewBox="0 0 24 24"><path d="M21.05 3.16 2.53 10.4c-1.24.5-1.23 1.2-.22 1.51l4.77 1.49 1.83 5.6c.22.62.36.86.73.86.34 0 .5-.16.7-.35l1.86-1.8 4.02 2.97c.74.41 1.27.2 1.46-.68l2.65-12.5c.28-1.16-.42-1.68-1.28-1.34Zm-11.7 9.03 8.35-5.27c.4-.24.76-.11.46.15L9.9 14.4l-.28 3.03-1.42-4.24Z"/></svg>
          <span id="telegram-btn-text">ارسال در تلگرام</span>
        </button>
        <button class="btn btn-download" id="download-btn">دانلود عکس</button>
      </div>

      <button class="btn btn-screenshot" id="screenshot-btn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
        گرفتن اسکرین‌شات
      </button>

      <div class="hint" id="hint-text">در حال آماده‌سازی تصویر برای ارسال...</div>
    </div>

    <footer>توسط گروه کُدینو <span>| Codino</span> ساخته شده</footer>
  </div>

  <div class="toast" id="toast"></div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="اسکرین‌شات کیوارکد" />
    <div class="lightbox-hint">برای ذخیره یا ارسال مستقیم در تلگرام، روی عکس نگه‌دارید (لمس طولانی) و گزینه‌ی ذخیره یا اشتراک‌گذاری را بزنید</div>
    <button class="lightbox-close" id="lightbox-close">بستن</button>
  </div>

<script>
  const input = document.getElementById('qr-input');
  const genBtn = document.getElementById('generate-btn');
  const qrSection = document.getElementById('qr-section');
  const qrCard = document.getElementById('qr-card');
  const qrContainer = document.getElementById('qrcode');
  const qrCaption = document.getElementById('qr-caption');
  const telegramBtn = document.getElementById('telegram-btn');
  const downloadBtn = document.getElementById('download-btn');
  const screenshotBtn = document.getElementById('screenshot-btn');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');
  const hintText = document.getElementById('hint-text');
  const toast = document.getElementById('toast');
  const themeDots = document.querySelectorAll('.theme-dot');
  const htmlEl = document.documentElement;

  let currentQR = null;
  let currentBlob = null;
  let currentValue = '';

  themeDots.forEach(dot=>{
    dot.addEventListener('click', ()=>{
      htmlEl.setAttribute('data-theme', dot.dataset.t);
      themeDots.forEach(d=> d.classList.remove('active'));
      dot.classList.add('active');
    });
  });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2800);
  }

  function nextPaint(){
    return new Promise(resolve=>{
      requestAnimationFrame(()=> requestAnimationFrame(resolve));
    });
  }

  async function renderShareImage(){
    hintText.textContent = 'در حال آماده‌سازی تصویر...';
    telegramBtn.disabled = true;
    downloadBtn.disabled = true;
    await nextPaint();
    try{
      const canvas = await html2canvas(qrCard, {
        backgroundColor: '#FFFFFF',
        scale: 3,
        useCORS: true
      });
      currentBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      telegramBtn.disabled = false;
      downloadBtn.disabled = false;
      hintText.textContent = navigator.share
        ? 'تصویر آماده است — روی دکمه بزنید'
        : 'تصویر آماده است — دکمه دانلود عکس را بزنید و در تلگرام ارسال کنید';
    }catch(err){
      telegramBtn.disabled = false;
      downloadBtn.disabled = false;
      hintText.textContent = 'برای ارسال، دکمه دانلود عکس را بزنید';
    }
  }

  async function generateQR(){
    const value = input.value.trim();
    if(!value){
      input.focus();
      input.style.borderColor = '#FF3B30';
      setTimeout(()=> input.style.borderColor = '', 900);
      showToast('لطفاً یک متن یا لینک وارد کنید');
      return;
    }

    currentValue = value;
    currentBlob = null;
    qrContainer.innerHTML = '';

    currentQR = new QRCode(qrContainer, {
      text: value,
      width: 210,
      height: 210,
      colorDark: "#0B0D12",
      colorLight: "#FFFFFF",
      correctLevel: QRCode.CorrectLevel.H
    });

    qrCaption.textContent = value;
    qrSection.classList.add('visible');
    qrSection.scrollIntoView({behavior:'smooth', block:'nearest'});

    renderShareImage();
  }

  genBtn.addEventListener('click', generateQR);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') generateQR(); });

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }

  downloadBtn.addEventListener('click', async ()=>{
    if(!currentBlob){
      showToast('صبر کنید تصویر آماده شود');
      return;
    }
    downloadBlob(currentBlob, 'codino-qr.png');
    showToast('تصویر کیوارکد دانلود شد');
  });

  screenshotBtn.addEventListener('click', async ()=>{
    if(!qrSection.classList.contains('visible')){
      showToast('ابتدا یک کیوارکد بسازید');
      return;
    }

    let blobToShow = currentBlob;

    if(!blobToShow){
      showToast('در حال گرفتن اسکرین‌شات...');
      try{
        await nextPaint();
        const canvas = await html2canvas(qrCard, { backgroundColor:'#FFFFFF', scale: 3 });
        blobToShow = await new Promise(res => canvas.toBlob(res, 'image/png'));
        currentBlob = blobToShow;
      }catch(e){
        showToast('گرفتن اسکرین‌شات ناموفق بود');
        return;
      }
    }

    const objUrl = URL.createObjectURL(blobToShow);
    lightboxImg.src = objUrl;
    lightbox.classList.add('visible');
  });

  lightboxClose.addEventListener('click', ()=>{
    lightbox.classList.remove('visible');
  });

  lightbox.addEventListener('click', (e)=>{
    if(e.target === lightbox) lightbox.classList.remove('visible');
  });

  telegramBtn.addEventListener('click', async ()=>{
    if(!qrSection.classList.contains('visible')){
      showToast('ابتدا یک کیوارکد بسازید');
      return;
    }

    if(!currentBlob){
      showToast('در حال آماده‌سازی تصویر، دوباره بزنید');
      renderShareImage();
      return;
    }

    const file = new File([currentBlob], 'codino-qr.png', { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{
        await navigator.share({
          files: [file],
          title: 'کُدینو | Codino',
          text: 'کیوارکد ساخته شده با کُدینو | Codino'
        });
        return;
      }catch(err){
        if(err.name === 'AbortError') return;
      }
    }

    // No file-share support on this browser (typical on desktop, or when
    // the page isn't opened as a standalone HTTPS page). Telegram's web
    // link can only carry text/links, not images, so we hand the user
    // the real PNG file to attach manually and open the chat picker too.
    downloadBlob(currentBlob, 'codino-qr.png');
    showToast('این مرورگر امکان ارسال مستقیم عکس را ندارد — عکس دانلود شد، آن را در تلگرام ضمیمه کنید');
    const text = encodeURIComponent('کیوارکد ساخته شده با کُدینو | Codino:\n' + currentValue);
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(currentValue) + '&text=' + text;
    window.open(url, '_blank');
  });
</script>

</body>
</html>
