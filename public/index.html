<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codina | بروزرسانی</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
radial-gradient(circle at top,#2563eb33,transparent 35%),
linear-gradient(135deg,#020617,#0f172a,#111827);

overflow:hidden;

color:#fff;

}

body::before{

content:"";

position:absolute;

width:350px;

height:350px;

background:#2563eb;

filter:blur(160px);

opacity:.25;

top:-120px;

right:-120px;

animation:move 8s infinite alternate;

}

@keyframes move{

100%{

transform:translate(-80px,60px);

}

}

.card{

width:min(92%,420px);

padding:45px 30px;

border-radius:32px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.12);

box-shadow:

0 20px 60px rgba(0,0,0,.45),

0 0 40px rgba(37,99,235,.25);

text-align:center;

}

.logo{

width:82px;

height:82px;

margin:auto;

border-radius:22px;

background:linear-gradient(135deg,#3b82f6,#06b6d4);

display:flex;

align-items:center;

justify-content:center;

font-size:38px;

font-weight:800;

margin-bottom:25px;

box-shadow:0 0 35px #2563eb88;

}

h1{

font-size:32px;

font-weight:800;

margin-bottom:12px;

}

h2{

font-size:18px;

font-weight:600;

color:#60a5fa;

margin-bottom:18px;

}

p{

line-height:2;

font-size:15px;

color:#d1d5db;

}

.loader{

margin:35px auto;

display:flex;

justify-content:center;

gap:10px;

}

.loader span{

width:11px;

height:11px;

background:#3b82f6;

border-radius:50%;

animation:bounce 1.2s infinite;

}

.loader span:nth-child(2){

animation-delay:.2s;

}

.loader span:nth-child(3){

animation-delay:.4s;

}

@keyframes bounce{

0%,80%,100%{

transform:scale(.5);

opacity:.3;

}

40%{

transform:scale(1.2);

opacity:1;

}

}

.badge{

display:inline-block;

margin-top:10px;

padding:10px 18px;

border-radius:50px;

background:#2563eb22;

border:1px solid #3b82f655;

color:#93c5fd;

font-size:14px;

}

footer{

margin-top:35px;

font-size:13px;

color:#64748b;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

Q

</div>

<h1>کُدینو</h1>

<h2>در حال بروزرسانی...</h2>

<p>

ما در حال طراحی نسل جدید سیستم ساخت
<b>QR Code</b>
هستیم.

<br><br>

نسخه جدید با امکانات پیشرفته‌تر، سرعت بیشتر و تجربه‌ای حرفه‌ای‌تر برای کاربران آسیا به‌زودی منتشر خواهد شد.

</p>

<div class="loader">

<span></span>

<span></span>

<span></span>

</div>

<div class="badge">

🚀 نسخه جدید به‌زودی منتشر می‌شود

</div>

<footer>

© 2026 Codina • Powered by Pedram AZ

</footer>

</div>

</body>
</html>
