<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درحال بروزرسانی</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Vazirmatn",sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    overflow:hidden;
}

/* مناسب برای نمایش موبایل 19:6 */
.phone{
    width:360px;
    height:780px;
    background:#fff;
    border-radius:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
    overflow:hidden;
    position:relative;
}

/* هدر */
.header{
    height:70px;
    background:#e6123d;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
}

/* بک گراند */
.bg{
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at top right,#ffebef 0%,transparent 40%),
    radial-gradient(circle at bottom left,#f3f4f6 0%,transparent 40%);
}

/* محتوا */
.content{
    position:relative;
    z-index:2;
    height:calc(100% - 70px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
}

/* آیکون */
.loader{
    width:90px;
    height:90px;
    border-radius:50%;
    border:6px solid #eee;
    border-top:6px solid #e6123d;
    animation:spin 1s linear infinite;
    margin-bottom:35px;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

h1{
    color:#333;
    font-size:28px;
    margin-bottom:12px;
}

p{
    color:#777;
    line-height:2;
    font-size:15px;
}

.footer{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    color:#aaa;
    font-size:13px;
}

.line{
    width:170px;
    height:5px;
    background:#ececec;
    border-radius:10px;
    overflow:hidden;
    margin:30px auto 0;
}

.line span{
    display:block;
    width:40%;
    height:100%;
    background:#e6123d;
    animation:move 1.5s infinite ease-in-out;
}

@keyframes move{
0%{margin-right:-40%;}
100%{margin-right:100%;}
}
</style>
</head>

<body>

<div class="phone">

<div class="bg"></div>

<div class="header">
درحال بروزرسانی
</div>

<div class="content">

<div class="loader"></div>

<h1>درحال بروزرسانی</h1>

<p>
در حال ارتقاء و بهبود خدمات هستیم.<br>
به‌زودی با امکانات جدید بازمی‌گردیم.
</p>

<div class="line">
<span></span>
</div>

</div>

<div class="footer">
© 2026 تمامی حقوق محفوظ است.
</div>

</div>

</body>
</html>
