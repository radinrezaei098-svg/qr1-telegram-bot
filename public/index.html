<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Studio</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Vazirmatn,sans-serif;
        }

        body{

            background:#0f172a;

            color:white;

            min-height:100vh;

            padding:25px;

        }

        .card{

            max-width:650px;

            margin:auto;

            background:#1e293b;

            border-radius:25px;

            padding:25px;

            box-shadow:0 0 35px rgba(0,0,0,.4);

        }

        h1{

            font-size:35px;

            text-align:center;

            font-weight:900;

            margin-bottom:10px;

        }

        p{

            text-align:center;

            color:#94a3b8;

            margin-bottom:30px;

        }

        select,input{

            width:100%;

            padding:15px;

            border:none;

            outline:none;

            border-radius:15px;

            background:#334155;

            color:white;

            margin-bottom:15px;

            font-size:16px;

        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:15px;

            cursor:pointer;

            font-size:18px;

            font-weight:bold;

            transition:.3s;

        }

        .generate{

            background:#2563eb;

            color:white;

        }

        .generate:hover{

            background:#1d4ed8;

        }

        .download{

            background:#16a34a;

            color:white;

            margin-top:10px;

        }

        .telegram{

            background:#06b6d4;

            color:white;

            margin-top:10px;

        }

        #canvas{

            margin:30px auto;

            display:block;

            background:white;

            border-radius:15px;

            padding:15px;

        }

        footer{

            text-align:center;

            margin-top:30px;

            color:#64748b;

            font-size:14px;

        }

    </style>

</head>

<body>

<div class="card">

<h1>QR Studio</h1>

<p>Professional QR Generator</p>

<select id="type">

<option value="text">متن</option>

<option value="url">لینک</option>

<option value="email">ایمیل</option>

<option value="phone">شماره تلفن</option>

<option value="wifi">WiFi</option>

<option value="telegram">تلگرام</option>

<option value="whatsapp">واتساپ</option>

</select>

<input
id="input"
placeholder="مقدار را وارد کنید">

<button
class="generate"
id="generate">

ساخت QR

</button>

<canvas id="canvas"></canvas>

<button
class="download">

دانلود PNG

</button>

<button
class="telegram">

ارسال در تلگرام

</button>

<footer>

© Pedram AZ

</footer>

</div>
