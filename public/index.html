<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Codino</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}

body{

background:#0f172a;

color:white;

padding:20px;

}

.container{

max-width:700px;

margin:auto;

}

.card{

background:#1e293b;

border-radius:20px;

padding:20px;

margin-top:20px;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

h1{

text-align:center;

margin-bottom:20px;

}

select,input,textarea{

width:100%;

padding:12px;

border:none;

border-radius:12px;

background:#334155;

color:white;

margin-top:8px;

margin-bottom:15px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

}

#preview{

margin-top:20px;

background:white;

border-radius:15px;

padding:20px;

display:flex;

justify-content:center;

align-items:center;

min-height:300px;

}

</style>

</head>

<body>

<div class="container">

<h1>📱 Codino</h1>

<div class="card">

<label>نوع کد</label>

<select id="type">

<option value="text">📝 متن</option>

<option value="link">🌐 لینک</option>

<option value="phone">📞 تلفن</option>

<option value="email">📧 ایمیل</option>

<option value="wifi">📶 وای فای</option>

<option value="telegram">✈️ تلگرام</option>

<option value="whatsapp">💚 واتساپ</option>

</select>

<label>متن</label>

<textarea id="content" placeholder="اینجا بنویس..."></textarea>

<button onclick="makeQR()">

ساخت QR Code

</button>

<div id="preview">

<span style="color:#555">

هنوز چیزی ساخته نشده

</span>

</div>

</div>

</div>

<script>

const tg=window.Telegram?.WebApp;

if(tg){

tg.ready();

tg.expand();

}

function makeQR(){

let text=document.getElementById("content").value;

let box=document.getElementById("preview");

box.innerHTML="";

QRCode.toCanvas(text,function(err,canvas){

if(err){

box.innerHTML="خطا";

return;

}

box.appendChild(canvas);

});

}

</script>

</body>

</html>
